<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FilRunway">
  <title>FilRunway</title>
  <!--
    The runway gauge, reduced to essentials. Geometry and palette are the
    dashboard's own (src/components/RunwayGauge.tsx, src/app/globals.css):
    a 270 degree arc opening at the bottom, starting at 135 degrees, split at
    the agent's real policy thresholds - 2 days EMERGENCY, 7 days TOP UP, on a
    14 day full scale - with the needle resting in HOLD.

    Centre is (32, 35), not (32, 32): the open-bottom arc's mass sits high, so
    the whole drawing is dropped 3 units to optically centre in the plate.

    Everything here has to survive a 16px favicon, so: the needle stops at the
    inner edge of the track (white on panel for its whole length, never white
    on green), it carries a tail through the pivot to buy length, and there are
    no graduations - at 16px a tick is a smudge.
  -->
  <rect width="64" height="64" rx="10" fill="#0a1119"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="9.25" fill="none" stroke="#1b2836" stroke-width="1.5"/>

  <!-- track: three bands, butt-joined at the thresholds. r=22, sweep 270. -->
  <g fill="none" stroke-width="7.5" stroke-linecap="butt">
    <path d="M 16.44 50.56 A 22 22 0 0 1 10.14 37.46" stroke="#ff4d63"/>
    <path d="M 10.14 37.46 A 22 22 0 0 1 32 13"       stroke="#ffb62e"/>
    <path d="M 32 13 A 22 22 0 0 1 47.56 50.56"       stroke="#2ee6a8"/>
  </g>

  <!-- needle, at 9.33d of 14d: exactly 45 degrees, so it stays crisp on a pixel grid -->
  <path d="M 43.17 20.71 L 46.28 23.83 L 29.10 42.71 L 24.29 37.90 Z" fill="#e9f3ff"/>
  <circle cx="32" cy="35" r="4.4" fill="#e9f3ff"/>
</svg>
